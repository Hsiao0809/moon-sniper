<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Sniper — 暴漲潛力幣種偵測 + 紙交易</title>
<style>
  :root {
    --bg: #0a0e17;
    --card: #131a2b;
    --card-hover: #1a2440;
    --border: #1e2d4a;
    --text: #e0e6f0;
    --text-dim: #6b7fa0;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.1);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,0.1);
    --blue: #3b82f6;
    --yellow: #f59e0b;
    --purple: #8b5cf6;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 8px 16px;
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 8px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 20px;
    background: linear-gradient(135deg, var(--green), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    color: var(--text-dim);
    font-size: 14px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .scan-time {
    color: var(--text-dim);
    font-size: 13px;
  }
  .btn {
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn:hover {
    background: var(--card-hover);
    border-color: var(--blue);
  }
  .btn-primary {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }
  .btn-primary:hover {
    opacity: 0.9;
  }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
    gap: 4px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 6px;
    text-align: center;
  }
  .stat-card .value {
    font-size: 14px;
    font-weight: 700;
  }
  .stat-card .label {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.blue { color: var(--blue); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    background: var(--card);
    border-radius: 8px;
    padding: 3px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    transition: all 0.2s;
    border: none;
    background: transparent;
  }
  .tab.active {
    background: var(--blue);
    color: white;
  }
  .tab:hover:not(.active) {
    color: var(--text);
    background: var(--card-hover);
  }

  /* Signal table */
  .table-wrap {
    overflow: auto;
    max-height: calc(100vh - 160px);
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  th {
    background: var(--card-hover);
    padding: 10px 12px;
    text-align: left;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
  }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--text); background: #22304f; }
  th.sortable .sort-indicator { color: var(--blue); margin-left: 3px; }
  .sticky-symbol {
    position: sticky;
    left: 0;
    z-index: 3;
    background: var(--card);
    box-shadow: 1px 0 0 var(--border);
  }
  th.sticky-symbol {
    z-index: 5;
    background: var(--card-hover);
  }
  tr:hover td.sticky-symbol { background: var(--card-hover); }
  td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--card-hover); }
  
  .symbol-name {
    font-weight: 600;
    font-size: 15px;
  }
  .symbol-link {
    color: var(--text);
    text-decoration: none;
    transition: color 0.2s;
  }
  .symbol-link:hover {
    color: var(--blue);
    text-decoration: underline;
  }
  .price {
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .change.positive { color: var(--green); }
  .change.negative { color: var(--red); }
  
  .score-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    width: 60px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .score-text {
    font-weight: 600;
  }
  .score-high { color: var(--green); }
  .score-mid { color: var(--yellow); }
  .score-low { color: var(--red); }
  
  .tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .tag {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .tag-breakout { background: rgba(59,130,246,0.2); color: var(--blue); }
  .tag-strong { background: rgba(239,68,68,0.2); color: var(--red); }
  .tag-rising { background: rgba(34,197,94,0.2); color: var(--green); }
  .tag-volume { background: rgba(245,158,11,0.2); color: var(--yellow); }
  .tag-reversal { background: rgba(139,92,246,0.2); color: var(--purple); }
  .tag-default { background: rgba(107,127,160,0.2); color: var(--text-dim); }

  /* Trade list */
  .trade-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    overflow: auto;
    max-height: calc(100vh - 190px);
  }
  .trade-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .trade-item .trade-symbol {
    font-weight: 700;
    font-size: 14px;
  }
  .trade-item .trade-pnl.positive { color: var(--green); }
  .trade-item .trade-pnl.negative { color: var(--red); }
  .trade-item .trade-info {
    color: var(--text-dim);
    font-size: 10px;
  }
  .trade-meta-grid {
    display: grid;
    grid-template-columns: repeat(2, max-content);
    gap: 2px 10px;
    font-size: 12px;
    line-height: 1.3;
  }
  .trade-status {
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 500;
  }
  .trade-status.open { background: rgba(59,130,246,0.2); color: var(--blue); }
  .trade-status.closed { background: rgba(107,127,160,0.2); color: var(--text-dim); }
  .trade-status.tp2 { background: rgba(34,197,94,0.2); color: var(--green); }
  .trade-status.sl { background: rgba(239,68,68,0.2); color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .emoji {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    body { padding: 8px; height: auto; min-height: 100dvh; overflow-y: auto; }
    .header { margin-bottom: 5px; gap: 5px; }
    .header h1 { font-size: 18px; }
    .header .subtitle { font-size: 12px; }
    .header-right { width: 100%; justify-content: space-between; gap: 6px; }
    .scan-time { font-size: 10px; line-height: 1.25; }
    .btn { padding: 6px 10px; font-size: 12px; }
    .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 5px; }
    .stat-card { padding: 4px 3px; }
    .stat-card .value { font-size: 13px; }
    .stat-card .label { font-size: 9px; }
    .tabs { margin-bottom: 5px; }
    .tab { padding: 6px 10px; font-size: 12px; }
    .table-wrap { max-height: none; overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }
    table { min-width: 1080px; }
    td, th { padding: 7px 8px; font-size: 12px; }
    .symbol-name { font-size: 13px; }
    .tag { font-size: 10px; padding: 1px 5px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🌙 Moon Sniper</h1>
    <div class="subtitle">暴漲潛力幣種偵測 · 紙交易追蹤</div>
  </div>
  <div class="header-right">
    <span class="scan-time" id="scanTime">—</span>
    <button class="btn btn-primary" onclick="refreshAll()">🔄 重新整理</button>
  </div>
</div>

<!-- Stats -->
<div class="stats-bar" id="statsBar">
  <div class="stat-card"><div class="value blue" id="statTotal">—</div><div class="label">潛力幣種</div></div>
  <div class="stat-card"><div class="value" id="statBalance">300</div><div class="label">帳戶餘額 (USDT)</div></div>
  <div class="stat-card"><div class="value" id="statOpenTrades">—</div><div class="label">進行中紙交易</div></div>
  <div class="stat-card"><div class="value green" id="statWinRate">—</div><div class="label">勝率</div></div>
  <div class="stat-card"><div class="value" id="statTotalPnl">—</div><div class="label">已實現損益 (USDT)</div></div>
  <div class="stat-card"><div class="value" id="statUnrealizedPnl">—</div><div class="label">未實現損益 (USDT)</div></div>
  <div class="stat-card"><div class="value" id="statTotalTrades">—</div><div class="label">總交易次數</div></div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-tab="signals" onclick="switchTab('signals')">📡 潛力幣種</button>
  <button class="tab" data-tab="trades" onclick="switchTab('trades')">📊 紙交易</button>
</div>

<!-- Signals Tab -->
<div id="tab-signals" class="tab-content">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="rank" onclick="sortSignals('rank')">#<span class="sort-indicator" data-sort-indicator="rank"></span></th>
          <th class="sortable sticky-symbol" data-sort="symbol" onclick="sortSignals('symbol')">幣種<span class="sort-indicator" data-sort-indicator="symbol"></span></th>
          <th class="sortable" data-sort="scanPrice" onclick="sortSignals('scanPrice')">掃描價<span class="sort-indicator" data-sort-indicator="scanPrice"></span></th>
          <th class="sortable" data-sort="livePrice" onclick="sortSignals('livePrice')">當前價<span class="sort-indicator" data-sort-indicator="livePrice"></span></th>
          <th class="sortable" data-sort="fromScan" onclick="sortSignals('fromScan')">掃描至今<span class="sort-indicator" data-sort-indicator="fromScan"></span></th>
          <th class="sortable" data-sort="change24h" onclick="sortSignals('change24h')">24h 漲跌<span class="sort-indicator" data-sort-indicator="change24h"></span></th>
          <th class="sortable" data-sort="volume24h" onclick="sortSignals('volume24h')">24h 成交量<span class="sort-indicator" data-sort-indicator="volume24h"></span></th>
          <th class="sortable" data-sort="score" onclick="sortSignals('score')">評分<span class="sort-indicator" data-sort-indicator="score"></span></th>
          <th class="sortable" data-sort="volumeScore" onclick="sortSignals('volumeScore')">量能<span class="sort-indicator" data-sort-indicator="volumeScore"></span></th>
          <th class="sortable" data-sort="momentum" onclick="sortSignals('momentum')">動能<span class="sort-indicator" data-sort-indicator="momentum"></span></th>
          <th class="sortable" data-sort="orderbook" onclick="sortSignals('orderbook')">訂單簿<span class="sort-indicator" data-sort-indicator="orderbook"></span></th>
          <th class="sortable" data-sort="smartMoney" onclick="sortSignals('smartMoney')">聰明錢<span class="sort-indicator" data-sort-indicator="smartMoney"></span></th>
          <th class="sortable" data-sort="breakout" onclick="sortSignals('breakout')">突破<span class="sort-indicator" data-sort-indicator="breakout"></span></th>
          <th class="sortable" data-sort="tags" onclick="sortSignals('tags')">訊號<span class="sort-indicator" data-sort-indicator="tags"></span></th>
        </tr>
      </thead>
      <tbody id="signalsBody">
      </tbody>
    </table>
  </div>
  <div id="signalsEmpty" class="empty-state" style="display:none">
    <div class="emoji">🔭</div>
    <div>正在等待第一次掃描...<br>請等待 GitHub Actions 執行或手動執行 scanner.py</div>
  </div>
</div>

<!-- Trades Tab -->
<div id="tab-trades" class="tab-content" style="display:none">
  <div class="tabs" style="margin-bottom:16px;background:transparent;padding:0;border:none">
    <button class="tab active" data-subtab="open" onclick="switchSubTab('open')">📌 持倉中</button>
    <button class="tab" data-subtab="closed" onclick="switchSubTab('closed')">📋 已平倉</button>
  </div>
  <div id="tab-open" class="subtab-content">
    <div class="trade-list" id="openTradesBody"></div>
    <div id="openTradesEmpty" class="empty-state" style="display:none">
      <div class="emoji">📭</div>
      <div>沒有進行中的交易</div>
    </div>
  </div>
  <div id="tab-closed" class="subtab-content" style="display:none">
    <div class="trade-list" id="closedTradesBody"></div>
    <div id="closedTradesEmpty" class="empty-state" style="display:none">
      <div class="emoji">📋</div>
      <div>還沒有已平倉的交易</div>
    </div>
  </div>
</div>

<script>
let dataCache = null;
let tradesCache = null;
let displayedSignals = [];
let sortState = { key: 'rank', dir: 'asc' };

async function refreshData() {
  try {
    const resp = await fetch('./signals.json?_=' + Date.now());
    const data = await resp.json();
    dataCache = data;
    
    // Try to load trades
    let tradesData = null;
    try {
      const tresp = await fetch('./paper_trades.json?_=' + Date.now());
      tradesData = await tresp.json();
    } catch(e) {}
    
    tradesCache = tradesData;
    render(data, tradesData);
  } catch(e) {
    document.getElementById('signalsBody').innerHTML = 
      `<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--text-dim)">
        ⚠️ 無法載入資料：${e.message}<br>
        <small>請確認 signals.json 已產生且 GitHub Pages 已部署</small>
      </td></tr>`;
  }
}

function render(data, tradesData) {
  // 更新時間
  const scanTime = data.scanned_at 
    ? '評分更新：' + new Date(data.scanned_at).toLocaleString('zh-TW', {timeZone:'Asia/Taipei'})
    : '—';
  let timeStr = scanTime;
  if (tradesData?.stats?.last_updated) {
    timeStr += ' | 交易更新：' + new Date(tradesData.stats.last_updated).toLocaleString('zh-TW', {timeZone:'Asia/Taipei'});
  }
  timeStr += ' | 即時價格每 30 秒刷新';
  document.getElementById('scanTime').textContent = timeStr;
  
  const signals = data.signals || [];
  const sortedSignals = getSortedSignals(signals);
  displayedSignals = sortedSignals;
  updateSortIndicators();
  const trades = tradesData?.trades || [];
  const stats = tradesData?.stats || {};
  
  // 載入即時價格
  fetchLivePrices(signals, trades);
  
  // Stats
  document.getElementById('statTotal').textContent = signals.length;
  document.getElementById('statBalance').textContent = ((stats.total_equity || stats.account_balance || 300) + (stats.total_unrealized_pnl_usdt || 0)).toFixed(2);
  document.getElementById('statOpenTrades').textContent = stats.open_count || 0;
  document.getElementById('statWinRate').textContent = (stats.win_rate || 0) + '%';
  document.getElementById('statWinRate').className = 'value ' + ((stats.win_rate || 0) >= 50 ? 'green' : 'red');
  const totalPnl = stats.total_realized_pnl_usdt || 0;
  const totalUnrealized = stats.total_unrealized_pnl_usdt || 0;
  document.getElementById('statTotalPnl').textContent = (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(2);
  document.getElementById('statTotalPnl').className = 'value ' + (totalPnl >= 0 ? 'green' : 'red');
  document.getElementById('statUnrealizedPnl').textContent = (totalUnrealized >= 0 ? '+' : '') + totalUnrealized.toFixed(2);
  document.getElementById('statUnrealizedPnl').className = 'value ' + (totalUnrealized >= 0 ? 'green' : 'red');
  // 勝率顯示盈/虧
  const wins = stats.wins || 0;
  const losses = stats.losses || 0;
  const closed = stats.closed_count || 0;
  document.getElementById('statWinRate').textContent = closed > 0 ? `✅ ${wins} / ❌ ${losses}（${(stats.win_rate || 0)}%）` : '—';
  document.getElementById('statWinRate').className = 'value ' + ((stats.win_rate || 0) >= 50 ? 'green' : 'red');
  document.getElementById('statTotalTrades').textContent = stats.total_trades || 0;
  
  // Signals table
  const tbody = document.getElementById('signalsBody');
  const empty = document.getElementById('signalsEmpty');
  
  if (sortedSignals.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = sortedSignals.map((s, i) => {
      const scores = s.scores;
      const chg = parseFloat(s.price_change_24h);
      const chgCls = chg >= 0 ? 'positive' : 'negative';
      const chgSign = chg >= 0 ? '+' : '';
      const vol = formatVolume(s.volume_24h_usdt);
      const scoreCls = scores.total >= 70 ? 'score-high' : scores.total >= 50 ? 'score-mid' : 'score-low';
      
      // 掃描價格與即時價格
      const scanPrice = parseFloat(s.price);
      const livePrice = livePrices[s.symbol];
      const displayPrice = livePrice || scanPrice;
      const chgFromScan = livePrice ? ((livePrice - scanPrice) / scanPrice) * 100 : 0;
      const chgScanCls = chgFromScan >= 0 ? 'positive' : 'negative';
      const chgScanSign = chgFromScan >= 0 ? '+' : '';
      
      const tags = (s.tags || []).map(t => {
        const cls = t.includes('突破') ? 'tag-breakout' 
          : t.includes('強勢') ? 'tag-strong'
          : t.includes('上漲') ? 'tag-rising'
          : t.includes('量') ? 'tag-volume'
          : t.includes('反轉') ? 'tag-reversal'
          : t.includes('雙底') || t.includes('雙頂') ? 'tag-breakout'
          : t.includes('壓縮') ? 'tag-volume'
          : t.includes('背離') ? 'tag-strong'
          : t.includes('買盤') || t.includes('支撐') ? 'tag-breakout'
          : t.includes('賣壓') ? 'tag-strong'
          : t.includes('聰明') ? 'tag-volume'
          : 'tag-default';
        return `<span class="tag ${cls}">${t}</span>`;
      }).join('');
      
      return `<tr>
        <td>${s._rank || i+1}</td>
        <td class="sticky-symbol"><a class="symbol-link" href="https://www.tradingview.com/chart/?symbol=BINANCE:${s.base}USDT" target="_blank" rel="noopener"><span class="symbol-name">${s.base}</span> 🔗</a></td>
        <td class="price">$${scanPrice.toFixed(scanPrice < 1 ? 6 : scanPrice < 100 ? 4 : 2)}</td>
        <td class="price">$${displayPrice.toFixed(displayPrice < 1 ? 6 : displayPrice < 100 ? 4 : 2)}</td>
        <td class="change ${chgScanCls}">${livePrice ? chgScanSign + chgFromScan.toFixed(2) + '%' : '—'}</td>
        <td class="change ${chgCls}">${chgSign}${chg.toFixed(2)}%</td>
        <td>${vol}</td>
        <td><span class="score-text ${scoreCls}">${scores.total}</span></td>
        <td>${scores.volume}</td>
        <td>${scores.momentum}</td>
        <td>${scores.orderbook || 50}</td>
        <td>${scores.smart_money || 0}</td>
        <td>${scores.breakout}</td>
        <td><div class="tags">${tags || '<span class="tag tag-default">觀察中</span>'}</div></td>
      </tr>`;
    }).join('');
  }
  
  // Trades list
  renderTrades(trades);
}


function getSortedSignals(signals) {
  const enriched = (signals || []).map((s, i) => ({...s, _rank: i + 1}));
  const key = sortState.key;
  const dir = sortState.dir === 'asc' ? 1 : -1;
  if (key === 'rank') {
    return enriched.sort((a, b) => (a._rank - b._rank) * dir);
  }
  return enriched.sort((a, b) => {
    const av = getSignalSortValue(a, key);
    const bv = getSignalSortValue(b, key);
    if (typeof av === 'string' || typeof bv === 'string') {
      return String(av).localeCompare(String(bv), 'zh-Hant') * dir;
    }
    return ((av || 0) - (bv || 0)) * dir;
  });
}

function getSignalSortValue(s, key) {
  const scanPrice = parseFloat(s.price) || 0;
  const livePrice = livePrices[s.symbol] || scanPrice;
  const scores = s.scores || {};
  switch (key) {
    case 'symbol': return s.base || s.symbol || '';
    case 'scanPrice': return scanPrice;
    case 'livePrice': return livePrice;
    case 'fromScan': return scanPrice ? ((livePrice - scanPrice) / scanPrice) * 100 : 0;
    case 'change24h': return parseFloat(s.price_change_24h) || 0;
    case 'volume24h': return Number(s.volume_24h_usdt) || 0;
    case 'score': return Number(scores.total) || 0;
    case 'volumeScore': return Number(scores.volume) || 0;
    case 'momentum': return Number(scores.momentum) || 0;
    case 'orderbook': return Number(scores.orderbook) || 0;
    case 'smartMoney': return Number(scores.smart_money) || 0;
    case 'breakout': return Number(scores.breakout) || 0;
    case 'tags': return (s.tags || []).join(' ');
    default: return s._rank || 0;
  }
}

function sortSignals(key) {
  if (sortState.key === key) {
    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
  } else {
    sortState.key = key;
    sortState.dir = ['symbol', 'rank'].includes(key) ? 'asc' : 'desc';
  }
  if (dataCache) render(dataCache, tradesCache);
}

function updateSortIndicators() {
  document.querySelectorAll('[data-sort-indicator]').forEach(el => {
    const key = el.getAttribute('data-sort-indicator');
    el.textContent = key === sortState.key ? (sortState.dir === 'asc' ? '▲' : '▼') : '';
  });
}

function formatVolume(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
  return v?.toFixed(0) || '0';
}

// 即時價格
let livePrices = {};
let liveInterval = null;

async function fetchLivePrices(signals, trades) {
  if (!signals || signals.length === 0) return;
  
  // 從 signals 和 open trades 收集所有需要即時價格的幣種
  const allSymbols = new Set();
  signals.forEach(s => allSymbols.add(s.symbol));
  (trades || []).forEach(t => { if (t.status === 'open') allSymbols.add(t.symbol); });
  
  if (allSymbols.size === 0) return;
  
  try {
    const symbolsArr = Array.from(allSymbols);
    const symbols = symbolsArr.map(s => `"${s}"`).join(',');
    const resp = await fetch(`https://api.binance.com/api/v3/ticker/price?symbols=[${symbols}]`);
    const data = await resp.json();
    
    livePrices = {};
    if (Array.isArray(data)) {
      data.forEach(d => { livePrices[d.symbol] = parseFloat(d.price); });
    }
    
    if (['livePrice', 'fromScan'].includes(sortState.key) && dataCache) {
      render(dataCache, tradesCache);
    } else {
      updateLiveDisplay(signals, trades);
    }
  } catch(e) {
    console.log('即時價格取得失敗，使用訊號價格');
  }
}

function updateLiveDisplay(signals, trades) {
  // 記住 scroll 位置
  const scrollY = window.scrollY;
  const tbody = document.getElementById('signalsBody');
  if (!tbody) return;
  
  // 更新信號表價格
  const rows = tbody.querySelectorAll('tr');
  rows.forEach((row, i) => {
    if (i >= displayedSignals.length) return;
    const s = displayedSignals[i];
    const live = livePrices[s.symbol];
    if (live) {
      const scanPrice = parseFloat(s.price);
      const chgFromScan = ((live - scanPrice) / scanPrice) * 100;
      const chgSign = chgFromScan >= 0 ? '+' : '';
      const priceCells = row.querySelectorAll('.price');
      // .price cells: [0]=掃描價, [1]=當前價
      if (priceCells.length >= 2) {
        priceCells[1].innerHTML = `$${live.toFixed(live < 1 ? 6 : live < 100 ? 4 : 2)}`;
      }
      // 掃描至今變化（第 5 個 td，index=4）
      const changeCells = row.querySelectorAll('.change');
      if (changeCells.length >= 1) {
        changeCells[0].innerHTML = chgSign + chgFromScan.toFixed(2) + '%';
        changeCells[0].className = 'change ' + (chgFromScan >= 0 ? 'positive' : 'negative');
      }
    }
  });
  
  // 更新紙交易列表
  renderTrades(trades);
  
  // 更新 stats bar 未實現損益
  updateUnrealizedStats(trades);
  
  // 恢復 scroll 位置
  window.scrollTo(0, scrollY);
}

// 獨立渲染紙交易，讓即時更新可以重複呼叫
function renderTrades(trades) {
  if (!trades) return;
  
  const openTrades = trades.filter(t => t.status === 'open');
  const closedTrades = trades.filter(t => t.status === 'closed');
  
  // 持倉中
  const openBody = document.getElementById('openTradesBody');
  const openEmpty = document.getElementById('openTradesEmpty');
  if (openTrades.length === 0) {
    openBody.innerHTML = '';
    openEmpty.style.display = 'block';
  } else {
    openEmpty.style.display = 'none';
    const sorted = [...openTrades].reverse();
    openBody.innerHTML = sorted.map(t => renderTradeItem(t)).join('');
  }
  
  // 已平倉
  const closedBody = document.getElementById('closedTradesBody');
  const closedEmpty = document.getElementById('closedTradesEmpty');
  if (closedTrades.length === 0) {
    closedBody.innerHTML = '';
    closedEmpty.style.display = 'block';
  } else {
    closedEmpty.style.display = 'none';
    const sorted = [...closedTrades].reverse();
    closedBody.innerHTML = sorted.map(t => renderTradeItem(t)).join('');
  }
}

function renderTradeItem(t) {
  // 已實現損益（已平倉）
  const realizedPnl = t.realized_pnl_usdt || 0;
  const realizedPnlPct = t.realized_pnl_pct || 0;

  const POSITION_VALUE = t.position_value || 600; // 改為讀取每筆交易的部位值
  const FEE_RATE = 0.0004; // 0.04% 手續費

  // 未實現損益（持有中，一律用即時價格計算）
  const live = t.status === 'open' ? (livePrices[t.symbol] || null) : null;
  let unrealizedPnl = 0;
  let unrealizedPnlPct = 0;
  if (live) {
    // 進出各一次手續費 = FEE_RATE * 2 * POSITION_VALUE
    const grossPnlPct = ((live - t.entry_price) / t.entry_price) * 100;
    const grossPnl = (grossPnlPct / 100) * POSITION_VALUE;
    const fees = POSITION_VALUE * FEE_RATE * 2; // 進+出
    unrealizedPnlPct = ((grossPnl - fees) / POSITION_VALUE) * 100;
    unrealizedPnl = grossPnl - fees;
  } else if (t.status === 'open') {
    unrealizedPnl = t.unrealized_pnl_usdt || 0;
    unrealizedPnlPct = t.unrealized_pnl_pct || 0;
  }

  // 顯示用的損益
  const displayPnl = t.status === 'closed' ? realizedPnl : unrealizedPnl;
  const displayPnlPct = t.status === 'closed' ? realizedPnlPct : unrealizedPnlPct;

  // 最大漲幅/回撤 — 持有中即時更新
  let maxPnlPct = t.max_unrealized_pnl_pct || 0;
  let minPnlPct = t.min_unrealized_pnl_pct || 0;
  if (t.status === 'open') {
    // 更新 stored max/min，並存回 data 以便下次刷新還能記住
    if (unrealizedPnlPct > maxPnlPct) {
      maxPnlPct = unrealizedPnlPct;
      t.max_unrealized_pnl_pct = unrealizedPnlPct;
      t.max_unrealized_pnl_usdt = unrealizedPnl;
    }
    if (unrealizedPnlPct < minPnlPct) {
      minPnlPct = unrealizedPnlPct;
      t.min_unrealized_pnl_pct = unrealizedPnlPct;
      t.min_unrealized_pnl_usdt = unrealizedPnl;
    }
  }
  
  const pnlCls = displayPnl >= 0 ? 'positive' : 'negative';
  const pnlSign = displayPnl >= 0 ? '+' : '';
  
  const statusText = t.status === 'open' ? '進行中'
    : t.exit_reason === 'tp2' ? '✅ 停利'
    : t.exit_reason === 'stop_loss' ? '❌ 停損'
    : t.exit_reason === 'timeout' ? '⏰ 時間到'
    : '已結束';
  const statusCls = t.status === 'open' ? 'open'
    : t.exit_reason === 'tp2' ? 'tp2'
    : t.exit_reason === 'stop_loss' ? 'sl'
    : 'closed';
  
  return `<div class="trade-item">
    <div>
      <a class="symbol-link" href="https://www.tradingview.com/chart/?symbol=BINANCE:${t.base}USDT" target="_blank" rel="noopener"><span class="trade-symbol">${t.base}</span> 🔗</a>
      <span class="trade-status ${statusCls}">${statusText}</span>
    </div>
    <div class="trade-meta-grid">
      <div>入場：$${t.entry_price.toFixed(t.entry_price < 1 ? 6 : t.entry_price < 100 ? 4 : 2)}</div>
      <div>保證金：${(t.margin || 300).toFixed(0)}U × ${t.leverage || 2}x</div>
      ${t.status === 'open' && livePrices[t.symbol] ? `<div>當前：$${livePrices[t.symbol].toFixed(livePrices[t.symbol] < 1 ? 6 : livePrices[t.symbol] < 100 ? 4 : 2)}</div>` : ''}
      ${t.exit_price ? `<div>出場：$${t.exit_price.toFixed(t.exit_price < 1 ? 6 : t.exit_price < 100 ? 4 : 2)}</div>` : ''}
      <div class="trade-info">${new Date(t.entry_time).toLocaleString('zh-TW', {timeZone:'Asia/Taipei'})}</div>
    </div>
    <div style="text-align:right">
      <div class="trade-pnl ${pnlCls}" style="font-size:15px;font-weight:700">${pnlSign}${displayPnl.toFixed(2)}U <span style="font-size:12px;font-weight:400">(${pnlSign}${displayPnlPct.toFixed(2)}%)</span></div>
      ${t.status === 'open' ? `<div style="font-size:10px;color:var(--text-dim);margin-top:2px">
        高 ${maxPnlPct > 0 ? '+' : ''}${maxPnlPct.toFixed(1)}% / 低 ${minPnlPct > 0 ? '+' : ''}${minPnlPct.toFixed(1)}%
      </div>` : ''}
    </div>
  </div>`;
}

// 即時更新 stats bar 的未實現損益
function updateUnrealizedStats(trades) {
  if (!trades) return;
  const tradeList = Array.isArray(trades) ? trades : (trades.trades || []);
  const FEE_RATE = 0.0004;
  let totalUnrealized = 0;
  let totalEquity = 300;
  for (const t of tradeList) {
    if (t.status === 'open') {
      const live = livePrices[t.symbol];
      if (live) {
        const posVal = t.position_value || 600;
        const grossPnl = ((live - t.entry_price) / t.entry_price) * posVal;
        const fees = posVal * FEE_RATE * 2;
        totalUnrealized += grossPnl - fees;
      }
    }
  }
  // 讀取 equity（從資料或從 DOM）
  const statsEl = document.getElementById('statBalance');
  const currentEquityText = statsEl?.textContent?.replace(/[^0-9.-]/g, '') || '300';
  totalEquity = parseFloat(currentEquityText) - totalUnrealized;
  if (isNaN(totalEquity) || totalEquity < 1) totalEquity = 300;
  const el = document.getElementById('statUnrealizedPnl');
  if (el) {
    el.textContent = (totalUnrealized >= 0 ? '+' : '') + totalUnrealized.toFixed(2);
    el.className = 'value ' + (totalUnrealized >= 0 ? 'green' : 'red');
  }
  // 同步更新帳戶餘額
  const balanceEl = document.getElementById('statBalance');
  if (balanceEl) {
    balanceEl.textContent = (totalEquity + totalUnrealized).toFixed(2);
  }
}

// 每 30 秒刷新即時價格
function startLiveUpdates(signals, trades) {
  if (liveInterval) clearInterval(liveInterval);
  liveInterval = setInterval(() => fetchLivePrices(signals, trades), 30000);
}

function switchTab(tab) {
  document.querySelectorAll('.tabs > .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelector(`.tabs > .tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).style.display = 'block';
}

function switchSubTab(subtab) {
  document.querySelectorAll('.tab-content .tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.subtab-content').forEach(t => t.style.display = 'none');
  document.querySelector(`.tab-content .tab[data-subtab="${subtab}"]`).classList.add('active');
  document.getElementById(`tab-${subtab}`).style.display = 'block';
}

// Auto refresh on load
let cachedSignals = [];
let cachedTrades = [];

async function refreshAll() {
  await refreshData();
  // 如果有資料，啟動即時更新
  if (cachedSignals.length > 0) {
    startLiveUpdates(cachedSignals, cachedTrades);
  }
}

// 覆蓋原來的 refreshData 來 cache 資料
const originalRender = render;
render = function(data, tradesData) {
  cachedSignals = data?.signals || [];
  cachedTrades = tradesData?.trades || [];
  originalRender(data, tradesData);
};

refreshAll();
</script>
