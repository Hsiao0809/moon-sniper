name: Moon Sniper Scan
on:
  workflow_dispatch:

concurrency:
  group: moon-sniper-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run scanner (swing mode)
        run: |
          set -o pipefail
          python scanner.py --mode swing 2>&1 | tee scanner_swing_debug.log
          python3 -c "import json; d=json.load(open('swing_signals.json')); print(f'swing 訊號數: {len(d.get(\"signals\",[]))}')"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}

      - name: Run scanner (scalp mode)
        run: |
          set -o pipefail
          python scanner.py --mode scalp 2>&1 | tee scanner_scalp_debug.log
          python3 -c "import json; d=json.load(open('scalp_signals.json')); print(f'scalp 訊號數: {len(d.get(\"signals\",[]))}')"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}

      - name: Run paper trader
        run: python paper_trader.py
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}

      - name: Run dashboard regression checks
        run: python test_dashboard_static.py

      - name: Commit results
        run: |
          git config user.name "moon-sniper-bot"
          git config user.email "bot@moon-sniper"
          git add swing_signals.json scalp_signals.json paper_trades.json signals.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "auto: scan update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Send Telegram notification
        run: python notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
