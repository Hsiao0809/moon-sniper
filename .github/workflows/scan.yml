name: Moon Sniper Scan
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允許 push
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run scanner
        run: |
          python scanner.py 2>&1 | tee scanner_debug.log
          echo "=== signals.json ==="
          python3 -c "import json; d=json.load(open('signals.json')); print(f'訊號數: {len(d[\"signals\"])}')"
          echo "=== DEBUG ==="
          cat scanner_debug.log | tail -20
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      
      - name: Run paper trader
        run: python paper_trader.py
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      
      - name: Commit results
        run: |
          git config user.name "moon-sniper-bot"
          git config user.email "bot@moon-sniper"
          git add signals.json paper_trades.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: scan update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
      
      - name: Send Telegram notification
        run: python notify.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
